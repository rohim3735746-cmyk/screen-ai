name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Auto-Organize Android Project Structure
      run: |
        echo "Auto-sorting project files..."
        
        # 1. Setup Gradle Wrapper folder
        mkdir -p gradle/wrapper
        [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/ || true
        
        # 2. Extract Kotlin Package Name automatically
        PKG=$(grep -m1 '^package ' MainActivity.kt 2>/dev/null | awk '{print $2}' | tr -d ';' | tr -d '\r' | tr '.' '/')
        [ -z "$PKG" ] && PKG="com/example/screenai"
        
        # 3. Create necessary App folders
        mkdir -p app/src/main/java/$PKG
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        
        # 4. Move Source Files to correct paths
        [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/$PKG/ || true
        [ -f ScreenAIAccessibilityService.kt ] && mv ScreenAIAccessibilityService.kt app/src/main/java/$PKG/ || true
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/ || true
        [ -f accessibility_service_config.xml ] && mv accessibility_service_config.xml app/src/main/res/xml/ || true
        
        # 5. Fix app build.gradle if needed
        if [ -f build.gradle.kts ] && grep -q "com.android.application" build.gradle.kts; then
          mkdir -p app
          cp build.gradle.kts app/build.gradle.kts
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Wrapper & Grant Permission
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          gradle wrapper || true
        fi
        chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace || ./gradlew build --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Universal-Screen-AI-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
